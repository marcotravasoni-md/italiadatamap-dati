name: Dati ISTAT

on:
  schedule:
    # Ogni notte alle 03:17 ora italiana d'inverno (02:17 UTC)
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Richieste massime a ISTAT in questo giro'
        default: '200'

permissions:
  contents: write

concurrency:
  group: dati-istat
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Prendi lo script
        uses: actions/checkout@v4

      - name: Usa Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recupera i dati già pubblicati (servono per aggiornare solo ciò che è cambiato)
        run: |
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" sito || mkdir -p sito
          rm -rf sito/.git

      - name: Aggiorna da ISTAT
        run: node aggiorna-dati.mjs --out sito --budget "${{ github.event.inputs.budget || '200' }}" --ore 5

      - name: Pubblica su GitHub Pages (ramo gh-pages, un solo commit)
        if: always()
        run: |
          test -f sito/catalogo.json || { echo "Niente da pubblicare"; exit 0; }
          cd sito
          git init -q -b gh-pages
          git config user.name "italiadatamap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Dati ISTAT $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
